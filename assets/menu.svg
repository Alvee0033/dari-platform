      const maxTrials = 10;

      function checkCookieBannerAndAdjustMenu() {
        const cookieBanner = document.querySelector('#onetrust-banner-sdk');

        if (cookieBanner) {
          let observer;

          if ('IntersectionObserver' in window) {
            observer = new IntersectionObserver(function(entries) {
              entries.forEach(function(entry) {
                const header = document.getElementsByTagName('header')[0];
                const smartBanner = document.getElementById('smartBanner');
                const mobileTitle = document.getElementById('mobileTitle');

                if (header) {
                  if (getComputedStyle(entry.target).display !== 'none') {
                    const cookieBannerHeight = entry.target.offsetHeight;

                    // Check for mobile screen
                    if (window.innerWidth <= 768) {
                      if (smartBanner) {
                        smartBanner.style.transition = 'margin-top 0.3s ease'; // Add transition
                        smartBanner.style.setProperty('margin-top', cookieBannerHeight + 'px', 'important');
                      } else if (mobileTitle) {
                        mobileTitle.style.transition = 'margin-top 0.3s ease'; // Add transition
                        mobileTitle.style.setProperty('margin-top', cookieBannerHeight + 'px', 'important');
                      }
                    } else {
                      header.style.transition = 'margin-top 0.3s ease'; // Add transition
                      header.style.setProperty('margin-top', cookieBannerHeight + 'px', 'important');
                    }
                  } else {
                    document.body.classList.remove('has-cookie-banner-open');
                    header.style.setProperty('margin-top', 0 + 'px', 'important');

                    // Reset the top property on mobile elements
                    if (smartBanner) {
                      smartBanner.style.transition = 'margin-top 0.3s ease'; // Add transition
                      smartBanner.style.setProperty('margin-top', 0 + 'px', 'important');
                    }
                    if (mobileTitle) {
                      mobileTitle.style.transition = 'margin-top 0.3s ease'; // Add transition
                      mobileTitle.style.setProperty('margin-top', 0 + 'px', 'important');
                    }
                  }
                }
              });
            });

            observer.observe(cookieBanner);
          }

          document.body.classList.add('has-cookie-banner');
          const cookieBannerHeight = cookieBanner.offsetHeight;
          const headerComponent = document.getElementsByTagName('header')[0];

          if (headerComponent) {
            if (window.innerWidth <= 768) {
              const smartBanner = document.getElementById('smartBanner');
              const mobileTitle = document.getElementById('mobileTitle');

              if (smartBanner) {
                smartBanner.style.transition = 'margin-top 0.3s ease'; // Add transition
                smartBanner.style.setProperty('margin-top', cookieBannerHeight + 'px', 'important');
              } else if (mobileTitle) {
                mobileTitle.style.transition = 'margin-top 0.3s ease'; // Add transition
                mobileTitle.style.setProperty('margin-top', cookieBannerHeight + 'px', 'important');
              }
            } else {
              headerComponent.style.transition = 'margin-top 0.3s ease'; // Add transition
              headerComponent.style.setProperty('margin-top', cookieBannerHeight + 'px', 'important');
            }
          }
          document.body.classList.add('has-cookie-banner-open');
          trialCount = 11;
        }

        trialCount++;
        if (trialCount < maxTrials) {
          setTimeout(checkCookieBannerAndAdjustMenu, 1000);
        }
      }

